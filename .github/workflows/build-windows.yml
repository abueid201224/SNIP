name: Build Windows Executable (ScrollSnip.exe)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Compile Windows EXE with PyInstaller
        run: |
          pyinstaller --clean ScrollSnip.spec

      - name: Verify Executable Exists
        shell: pwsh
        run: |
          if (Test-Path "dist/ScrollSnip.exe") {
            $size = (Get-Item "dist/ScrollSnip.exe").Length / 1MB
            Write-Host "Success: dist/ScrollSnip.exe created ($([math]::Round($size, 2)) MB)"
          } else {
            Write-Error "dist/ScrollSnip.exe was not found!"
            exit 1
          }

      - name: Package Release ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/ScrollSnip-v2.0.0"
          Copy-Item "dist/ScrollSnip.exe" -Destination "dist/ScrollSnip-v2.0.0/"
          Copy-Item "README.md" -Destination "dist/ScrollSnip-v2.0.0/"
          Copy-Item "requirements.txt" -Destination "dist/ScrollSnip-v2.0.0/"
          Compress-Archive -Path "dist/ScrollSnip-v2.0.0/*" -DestinationPath "dist/ScrollSnip-v2.0.0-windows-x64.zip"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrollSnip-Windows-EXE
          path: |
            dist/ScrollSnip.exe
            dist/ScrollSnip-v2.0.0-windows-x64.zip
          retention-days: 90

      - name: Create GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ScrollSnip.exe
            dist/ScrollSnip-v2.0.0-windows-x64.zip
          name: Release ${{ github.ref_name }}
          body: |
            ## ScrollSnip v2.0.0 Windows Executable
            
            - Built automatically on Windows runner with Python 3.10 and PyInstaller.
            - Standalone single-file binary: `ScrollSnip.exe` (no Python installation required).
            - Full Arabic & English UI, Per-Monitor DPI v2, UI Automation, and built-in editor.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
